
name: Android Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    name: Verify Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set Up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify APK Compilation
        run: gradle --no-daemon :app:assembleDebug

      - name: Confirm APK Generated
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "Audio Converter APK build verification passed."

      - name: Publish Build Summary
        if: always()
        run: |
          echo "## Android Audio Converter" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: v1.5" >> "$GITHUB_STEP_SUMMARY"
          echo "Build verification completed." >> "$GITHUB_STEP_SUMMARY"
          echo "No APK artifacts are distributed." >> "$GITHUB_STEP_SUMMARY"
